name: file-transfer-demo

x-demo-computer: &demo-computer
  image: file-transfer-demo-computer:local
  platform: linux/amd64
  build:
    context: .
    dockerfile: packaging/demo/Dockerfile
    target: demo
    additional_contexts:
      work-transfer: ./dist
  depends_on:
    demo-keygen:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6080"]
    interval: 5s
    timeout: 2s
    retries: 20
    start_period: 10s

services:
  demo-keygen:
    image: file-transfer-demo-keygen:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: packaging/demo/Dockerfile
      target: demo-keygen
    volumes:
      - computer-a-keys:/computer-a-keys
      - computer-b-keys:/computer-b-keys
    restart: "no"

  computer-a:
    <<: *demo-computer
    hostname: computer-a
    environment:
      DEMO_SIDE: computer-a
      PEER_HOST: computer-b
    volumes:
      - computer-a-keys:/demo-keys:ro
    ports:
      # DEMO ONLY: passwordless noVNC must never bind beyond host loopback.
      - "127.0.0.1:${COMPUTER_A_PORT:-6081}:6080"

  computer-b:
    <<: *demo-computer
    hostname: computer-b
    environment:
      DEMO_SIDE: computer-b
      # DEMO ONLY: fixed password for the isolated A-to-B SSH demonstration.
      DEMO_SSH_PASSWORD: demo
    expose:
      - "22"
    volumes:
      - computer-b-keys:/demo-keys:ro
    ports:
      # DEMO ONLY: passwordless noVNC must never bind beyond host loopback.
      - "127.0.0.1:${COMPUTER_B_PORT:-6082}:6080"

volumes:
  # Separate bundles keep B's private host identity out of Computer A.
  computer-a-keys:
  computer-b-keys:
